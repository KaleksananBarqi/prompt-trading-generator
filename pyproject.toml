[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smc-prompt"
version = "0.1.0"
description = "Mechanical SMC/ICT [FAKTA] payload generator for a downstream text LLM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "pyperclip>=1.8.2",
    "click>=8.1.7",
    "jinja2>=3.1.2",
]

[project.scripts]
smc-prompt = "smc_prompt.cli:main"

[tool.setuptools]
packages = ["smc_prompt"]

[tool.setuptools.package-data]
smc_prompt = ["templates/*.j2"]
